# CI -- PLACEHOLDER (Phase 1)
#
# PURPOSE
#   Lint, type-check, and test the lab.
#
# FUTURE
#   lab-smoke.yml (Phase 2)  -- both profiles boot, ingest the corpus, and answer a query
#   docker.yml    (Phase 2)  -- image builds
#
# The parity test tier is the one that matters most here: it asserts both profiles answer benign
# queries equivalently. Without it the two applications drift, and once they drift RAGStrike's
# differential validation silently stops measuring security controls.

name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev,ui]"
      - run: black --check .
      - run: ruff check .
      - run: mypy rag backend profiles

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev,ui]"
      - run: pytest -m "not integration"
