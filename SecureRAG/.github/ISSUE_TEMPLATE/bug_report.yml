name: Bug report
description: Something is broken that is NOT a documented weakness
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **This application is insecure on purpose.** Check
        [docs/vulnerabilities.md](../blob/main/docs/vulnerabilities.md) first — if the behaviour you
        found is in that catalogue, it is the specification, not a bug.

        Containment failures (anything reachable off-host) should be reported privately via
        [SECURITY.md](../blob/main/SECURITY.md), not here.

  - type: checkboxes
    id: not-documented
    attributes:
      label: Confirmation
      options:
        - label: I checked docs/vulnerabilities.md and this is NOT one of the documented weaknesses
          required: true

  - type: dropdown
    id: profile
    attributes:
      label: Which profile?
      options: [vulnerable, secure, both]
    validations: { required: true }

  - type: textarea
    id: what
    attributes:
      label: What happened
    validations: { required: true }

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations: { required: true }

  - type: input
    id: python
    attributes:
      label: Python version
    validations: { required: true }
