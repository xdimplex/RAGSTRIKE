# VulnerableRAG -- project metadata and tool configuration.
#
# PURPOSE
#   Packaging and tool configuration for the lab.
#
# WHY IT IS NOT PUBLISHED
#   `classifiers` marks this Private :: Do Not Upload. This application must never reach PyPI, and
#   the classifier makes an accidental `twine upload` fail rather than succeed.

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-rag"
version = "0.1.0"
description = "The hardened half of a RAG security lab -- VulnerableRAG with the defences on"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
    "Private :: Do Not Upload",       # this must never be published
    "Development Status :: 2 - Pre-Alpha",
    "Topic :: Security",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "aiosqlite>=0.20",
    "chromadb>=0.5",
    "pypdf>=4.2",
    "langchain-text-splitters>=0.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    # Transitive (fastapi and streamlit both pull it), pinned here because the upper bound is load
    # bearing. starlette 1.4.0 made `thread_minimum_size` a REQUIRED keyword-only argument of
    # GZipResponder; streamlit 1.61.0 -- the newest release -- still constructs its
    # `_MediaAwareGZipResponder` subclass without it. Every gzipped response then dies with
    # `TypeError: GZipResponder.__init__() missing 1 required keyword-only argument`, so the chat UI
    # returns HTTP 500 to a browser while curl sees 200 (curl sends no Accept-Encoding by default,
    # and small responses fall under the compression threshold anyway). Both projects allow
    # starlette <2, so nothing but this pin keeps the resolver off the broken version.
    "starlette<1.4",
]

[project.optional-dependencies]
ui = ["streamlit>=1.33", "pandas>=2.2"]
dev = [
    "pytest>=8.1", "pytest-asyncio>=0.23", "pytest-cov>=5.0",
    "black>=24.3", "ruff>=0.3", "mypy>=1.9", "pre-commit>=3.7",
    "types-pyyaml>=6.0",
]

# This is a flat multi-package repository, not a single package, so auto-discovery cannot guess.
# Listing the packages explicitly also keeps corpus/, docs/, uploads/, and data/ out of an install.
[tool.setuptools.packages.find]
include = [
    "backend*", "database*", "frontend*", "profiles*",
    "rag*", "vectorstore*", "scripts*",
]
exclude = ["tests*", "corpus*", "docs*", "assets*", "docker*", "uploads*", "data*", "logs*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["rag", "backend", "profiles", "database", "vectorstore"]

[[tool.mypy.overrides]]
module = ["chromadb.*", "streamlit.*", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
# INFO, not the default WARNING. Logging is a Phase 2 requirement, and at WARNING the `log.info`
# calls are never constructed -- which hid a real crash (an `extra` key colliding with a reserved
# LogRecord attribute raises at the call site). Exercising them here turns that class of bug into a
# test failure instead of a runtime one.
log_level = "INFO"
markers = [
    "unit: pure functions",
    "integration: requires Chroma and the database",
    "parity: asserts SecureRAG exposes the same API surface as VulnerableRAG",
    "policy: verifies a single security control",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The vulnerable profile is insecure on purpose. Its system prompt contains synthetic, canary-tagged
# credentials and its policy chain is deliberately empty. Security lint would flag exactly the things
# that are the specification.
"profiles/secure/**" = ["S"]
"tests/**" = ["S"]
