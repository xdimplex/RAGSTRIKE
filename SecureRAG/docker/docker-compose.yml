# VulnerableRAG lab -- PLACEHOLDER (Phase 1)
#
# PURPOSE
#   Runs both profiles plus Ollama on one network.
#
# FUTURE RESPONSIBILITIES
#   ollama          pinned qwen3 tag, model volume, 127.0.0.1:11434
#   vulnerable-rag  api 127.0.0.1:9000, ui 127.0.0.1:8601
#   secure-rag      api 127.0.0.1:9001, ui 127.0.0.1:8602
#   Named volumes for chroma and the databases, separate per profile
#
# SAFETY -- READ BEFORE EDITING
#   EVERY published port binds explicitly to 127.0.0.1. Writing `- "9000:9000"` publishes on 0.0.0.0
#   on most Docker installations, which would expose an application that executes instructions found
#   in uploaded documents to your entire local network.
#
#   Both profiles also require RAGSTRIKE_LAB_ACK=1 to start. Do not bake that into the image -- the
#   gate only works if a human sets it deliberately.

services: {}
  # ollama:
  #   image: ollama/ollama:0.1.41          # PINNED. An unpinned tag silently breaks reproducibility.
  #   ports: ["127.0.0.1:11434:11434"]
  #
  # vulnerable-rag:
  #   build: { context: .., dockerfile: docker/Dockerfile.vulnerable }
  #   ports: ["127.0.0.1:9000:9000", "127.0.0.1:8601:8601"]
  #   environment: ["VRAG_PROFILE=vulnerable", "RAGSTRIKE_LAB_ACK=1"]
  #
  # secure-rag:
  #   build: { context: .., dockerfile: docker/Dockerfile.secure }
  #   ports: ["127.0.0.1:9001:9001", "127.0.0.1:8602:8602"]
  #   environment: ["VRAG_PROFILE=secure", "RAGSTRIKE_LAB_ACK=1"]

volumes: {}
networks: {}
