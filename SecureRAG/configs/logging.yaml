# VulnerableRAG -- logging configuration.
#
# PURPOSE
#   Application and query logging for the lab.
#
# NOTE
#   Unlike RAGStrike, this lab has no redaction pipeline -- and that is itself part of the lesson.
#   A production RAG application should redact its logs; the vulnerable profile deliberately does not,
#   which is one of the things a learner should notice. The corpus is synthetic precisely so this is
#   safe.
version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s %(levelname)s %(name)s %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    level: INFO
  file:
    class: logging.handlers.RotatingFileHandler
    filename: logs/vulnerable-rag.log
    maxBytes: 10485760
    backupCount: 3
    formatter: standard
    level: DEBUG

root:
  level: INFO
  handlers: [console, file]
