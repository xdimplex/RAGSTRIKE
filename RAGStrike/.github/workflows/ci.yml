# CI -- PLACEHOLDER (Phase 1)
#
# PURPOSE
#   Runs the same gates pre-commit runs locally, on every push and pull request.
#
# WHY IT EXISTS NOW, BEFORE THERE IS CODE
#   The lint, type, and LAYERING gates are wired before there is any code capable of violating them.
#   Retrofitting a dependency rule onto an existing codebase is a project; maintaining one from the
#   first commit is free.  The `lint-imports` step below is the single most important job in the file.
#
# CURRENT STATE
#   Jobs are declared and will run.  `pytest` currently collects nothing, which is expected: Phase 1
#   ships no implementation.  Do NOT add `continue-on-error` to make a gate pass -- a gate that can be
#   ignored is not a gate.
#
# FUTURE WORKFLOWS (see docs/annex-d-risk-roadmap.md)
#   security.yml      bandit, pip-audit, CodeQL, gitleaks                        Phase 11
#   packs.yml         pack conformance suite on any pack change                  Phase 4
#   differential.yml  nightly SC1 validation: VulnerableRAG E/F, SecureRAG A/B   Phase 10
#   docs.yml          MkDocs build and link check                                Phase 11
#   release.yml       build, publish to PyPI, push Docker images                 Phase 11

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, and layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: black
        run: black --check .
      - name: ruff
        run: ruff check .
      - name: mypy (strict)
        run: mypy src
      - name: import-linter (THE dependency rule)
        run: lint-imports

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # NFR-02: Linux, macOS, and Windows are all supported, so all three are tested.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        run: pytest -m "not system" --cov --cov-report=xml
      # Coverage gate activates in Phase 3, once there is code to cover.
      # - name: Coverage gate
      #   run: coverage report --fail-under=70

  schemas:
    name: Validate manifests and configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pyyaml
      - name: Parse every YAML file
        run: |
          python - <<'PY'
          import sys, pathlib, yaml
          bad = []
          for p in pathlib.Path(".").rglob("*.y*ml"):
              if ".venv" in p.parts or "node_modules" in p.parts:
                  continue
              try:
                  list(yaml.safe_load_all(p.read_text(encoding="utf-8")))
              except Exception as exc:
                  bad.append(f"{p}: {exc}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("all YAML parsed")
          PY
