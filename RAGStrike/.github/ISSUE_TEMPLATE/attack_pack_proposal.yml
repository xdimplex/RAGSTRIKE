name: Attack pack proposal
description: Propose a new attack technique or a new attack pack
labels: ["attack-pack", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Attack packs are plugins — adding one requires **zero core changes**. See
        [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md#contributing-an-attack-pack).

        **The detection strategy is the hard part.** Generating a payload is easy; deciding whether it
        worked is the actual research problem. This template asks about detection first, deliberately.

  - type: input
    id: technique
    attributes:
      label: Technique name
    validations: { required: true }

  - type: textarea
    id: description
    attributes:
      label: How the attack works
    validations: { required: true }

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Prompt Injection
        - Indirect Prompt Injection
        - Prompt Leakage
        - Role Override
        - Context Injection
        - Context Poisoning
        - Secret Extraction
        - PII Leakage
        - Context Window Overflow
        - Hallucination Evaluation
        - Retrieval Integrity
        - Citation Verification
        - New category
    validations: { required: true }

  - type: textarea
    id: detection
    attributes:
      label: How would we know it succeeded?
      description: >
        The most important field. Can a canary be planted — a high-entropy token whose appearance is
        deterministic proof? If not, which built-in detectors apply, and what is the expected
        false-positive behaviour? A technique with no reliable oracle is not yet ready to ship.
    validations: { required: true }

  - type: dropdown
    id: canary
    attributes:
      label: Can this be proven with a canary token?
      options:
        - "Yes — a canary gives deterministic proof"
        - "Partially — a canary covers some cases"
        - "No — this needs semantic judgment"
    validations: { required: true }

  - type: checkboxes
    id: capabilities
    attributes:
      label: Target capabilities required
      options:
        - label: CHAT
        - label: INGEST_DOCUMENT
        - label: RETURN_CHUNKS
        - label: LIST_SOURCES
        - label: SESSION_MEMORY

  - type: textarea
    id: references
    attributes:
      label: References
      description: Papers, advisories, or write-ups. Techniques must be publicly documented and attributable.
    validations: { required: true }

  - type: textarea
    id: remediation
    attributes:
      label: Remediation
      description: >
        What defence stops this? Every attack ships with a recommendation — a technique contributed
        without one is incomplete work.
    validations: { required: true }

  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: Payloads are non-destructive — they demonstrate a weakness without causing damage
          required: true
        - label: This does not require detection evasion or rate-limit circumvention
          required: true
