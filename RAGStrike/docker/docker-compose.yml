# RAGStrike core services -- PLACEHOLDER (Phase 1)
#
# PURPOSE
#   Runs the API and the dashboard together for local use.
#
# FUTURE RESPONSIBILITIES
#   - api: build Dockerfile.api, bind 127.0.0.1:8000, mount ../data and ../reports
#   - dashboard: build Dockerfile.dashboard, bind 127.0.0.1:8501, depends_on api
#   - Named volumes so evidence survives `docker compose down`
#
# NOTE ON BINDINGS
#   Every port binds to 127.0.0.1 explicitly. `- "8000:8000"` publishes on 0.0.0.0 on most Docker
#   installations, which would expose a security tool holding raw evidence to the local network.
#
# For the full differential lab (Ollama + VulnerableRAG + SecureRAG) see docker-compose.lab.yml.

services: {}
  # api:
  #   build: { context: .., dockerfile: docker/Dockerfile.api }
  #   ports: ["127.0.0.1:8000:8000"]
  #   volumes: ["../data:/app/data", "../reports:/app/reports"]
  #
  # dashboard:
  #   build: { context: .., dockerfile: docker/Dockerfile.dashboard }
  #   ports: ["127.0.0.1:8501:8501"]
  #   environment: [ "RAGSTRIKE_DASHBOARD__API_BASE_URL=http://api:8000" ]
  #   depends_on: [api]

volumes: {}
