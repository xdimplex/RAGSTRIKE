# RAGStrike differential lab -- PLACEHOLDER (Phase 1)
#
# PURPOSE
#   The full validation environment: Ollama, VulnerableRAG, SecureRAG, and RAGStrike on one network.
#   This is what the nightly differential job (SC1) runs against.
#
# WHY IT MATTERS
#   Every other test verifies that the code does what it was written to do. The differential test is
#   the only one that verifies RAGStrike is *right*: VulnerableRAG must grade E/F and SecureRAG must
#   grade A/B, with per-category minimum finding counts so that "detects nothing, grades everything A"
#   cannot pass.
#
# FUTURE RESPONSIBILITIES
#   - ollama: pinned Qwen3 tag (an unpinned tag silently breaks reproducibility), model volume
#   - vulnerable-rag: 127.0.0.1:9000 / 8601
#   - secure-rag:     127.0.0.1:9001 / 8602
#   - ragstrike-api:  127.0.0.1:8000
#
# SAFETY
#   VulnerableRAG is deliberately insecure. EVERY published port binds to 127.0.0.1 and nothing is
#   published beyond the host. Do not change this to make remote access convenient.

services: {}
volumes: {}
networks: {}
